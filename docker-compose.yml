services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buenprecio
      POSTGRES_PASSWORD: buenprecio_dev
      POSTGRES_DB: buenprecio
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buenprecio -d buenprecio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: